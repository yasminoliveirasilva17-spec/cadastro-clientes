<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Cadastro de Clientes</h1>
        <p>Sistema de gerenciamento de clientes</p>
    </header>

    <main>
        <section class="card">
            <h2 id="tituloFormulario">Cadastrar Cliente</h2>

            <form id="formCliente">
                <input type="hidden" id="id">

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" required>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" required>

                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input 
                        type="text" 
                        id="cpf" 
                        name="cpf" 
                        placeholder="Digite o CPF"
                        maxlength="14"
                        required
                    >

                <div class="botoes">
                    <button type="submit" id="btnSalvar">
                        Cadastrar Cliente
                    </button>

                    <button type="button" id="btnCancelar" class="cancelar">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Clientes cadastrados</h2>

            <div class="resumo">
                Total de clientes: <strong id="totalClientes">0</strong>
            </div>

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar por nome ou e-mail..."
            >

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Cidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaClientes"></tbody>
                </table>
            </div>

            <button id="btnLimparTudo" class="excluir-todos">
                Limpar todos os registros
            </button>
        </section>
    </main>

    <footer>
        <p>Projeto desenvolvido para fins educacionais.</p>
    </footer>

    <script src="cliente.js"></script>
    <script src="gerenciadorCliente.js"></script>
    <script src="app.js"></script>

</body>
</html>
